spring.application.name=inventhor
spring.profiles.active=${SPRING_PROFILE:dev}
server.port=${PORT:8080}

# Datasource config
spring.datasource.url=jdbc:postgresql://localhost:5432/inventhor
spring.datasource.username=SystemAdmin
spring.datasource.password=inventhorPokemon
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate config
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_MODE:validate}

# Logging config
spring.jpa.show-sql=${SHOW_JPA_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.stat=${HIBERNATE_LOG_LEVEL:debug}

# Data Initialization
spring.sql.init.platform=postgresql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${INIT_MODE:always}

# Swagger config
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

# Security config
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://kc.xn--flisbonn-64a.no/realms/inventhor
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://kc.xn--flisbonn-64a.no/realms/inventhor/protocol/openid-connect/certs

keycloak.realm=inventhor
keycloak.auth-server-url=https://kc.xn--flisbonn-64a.no/auth
keycloak.resource=inventhor-app
keycloak.credentials.secret=mewtwoBulbasaur
keycloak.enabled=true